# ============================================================================
# Render Blueprint Configuration for Shiri Mandir
# Deploys Full-Stack Web Service (React + Express API) with PostgreSQL on Render
# ============================================================================

services:
  # 1. Full-Stack Web Service (Node.js + Express API + React UI)
  - type: web
    name: shirimandir-web
    env: node
    plan: free
    region: singapore # High proximity to Indian subcontinent & low latency
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: STORAGE_PROVIDER
        value: local
      # Attach PostgreSQL database connection string
      - key: DATABASE_URL
        fromDatabase:
          name: shirimandir-db
          property: connectionString

databases:
  # 2. Managed PostgreSQL Instance on Render
  - name: shirimandir-db
    databaseName: shirimandir
    user: shirimandir_admin
    plan: free
    region: singapore
